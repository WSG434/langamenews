# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    telegram_bot_token: '%env(TELEGRAM_BOT_TOKEN)%'
    telegram_chat_id: '%env(TELEGRAM_CHAT_ID)%'
    telegram_bot_name: '%env(TELEGRAM_BOT_NAME)%'
    telegram_mode_default: 'webhook'
    telegram_mode: '%env(default:telegram_mode_default:TELEGRAM_MODE)%'
    sse_loop_seconds: 55
    news_api_key: '%env(default::NEWS_API_KEY)%'
    guardian_api_key: '%env(default::GUARDIAN_API_KEY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Telegram\TelegramSender:
        arguments:
            $botToken: '%telegram_bot_token%'
            $chatId: '%telegram_chat_id%'

    App\Command\TelegramPollingCommand:
        arguments:
            $botToken: '%telegram_bot_token%'
            $telegramMode: '%telegram_mode%'

    _instanceof:
        App\News\Source\NewsSourceFetcherInterface:
            tags: ['app.news_fetcher']
        App\Notification\NotificationSenderInterface:
            tags: ['app.notification_sender']

    # Specific fetchers must come before GenericRssFetcher (higher priority = earlier in iterator)
    App\News\Source\LentaFetcher:
        tags: [{ name: 'app.news_fetcher', priority: 20 }]

    App\News\Source\HabrFetcher:
        tags: [{ name: 'app.news_fetcher', priority: 20 }]

    App\News\Source\GenericRssFetcher:
        tags: [{ name: 'app.news_fetcher', priority: 0 }]

    App\News\Source\NewsApiFetcher:
        arguments:
            $apiKey: '%news_api_key%'
        tags: [{ name: 'app.news_fetcher', priority: 10 }]

    App\News\Source\GuardianFetcher:
        arguments:
            $apiKey: '%guardian_api_key%'
        tags: [{ name: 'app.news_fetcher', priority: 10 }]

    App\News\Source\HackerNewsFetcher:
        tags: [{ name: 'app.news_fetcher', priority: 10 }]

    App\News\Source\ThreeDNewsFetcher:
        tags: [{ name: 'app.news_fetcher', priority: 10 }]

    App\News\Source\MkRuFetcher:
        tags: [{ name: 'app.news_fetcher', priority: 10 }]

    App\News\NewsImporter:
        arguments:
            $fetchers: !tagged_iterator app.news_fetcher

    App\Notification\NotificationDispatcher:
        arguments:
            $senders: !tagged_iterator app.notification_sender

    App\Controller\NotificationStreamController:
        arguments:
            $loopSeconds: '%sse_loop_seconds%'

    App\Command\AppSetupCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Controller\SettingsController:
        arguments:
            $botName: '%telegram_bot_name%'

    App\Controller\TelegramLoginController:
        arguments:
            $botName: '%telegram_bot_name%'

    App\Controller\ConfirmationController:
        arguments:
            $codeSendLimiter: '@limiter.code_send'
            $codeAttemptsLimiter: '@limiter.code_attempts'
            $botName: '%telegram_bot_name%'

when@test:
    parameters:
        sse_loop_seconds: 0

    services:
        App\Notification\Sender\TelegramNotificationSender:
            arguments:
                $telegram: '@App\Service\Telegram\TelegramSender'
                $logger: '@logger'
                $enabled: false
