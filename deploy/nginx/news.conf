server {
    listen 80;
    server_name _;

    root /var/www/news/public;
    index index.php;

    access_log /var/log/nginx/news.access.log;
    error_log  /var/log/nginx/news.error.log;

    # SSE endpoint — separate FPM pool, buffering off
    location /stream/ {
        fastcgi_pass unix:/run/php/php8.5-fpm-news_stream.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_buffering        off;
        fastcgi_read_timeout     120s;
        fastcgi_send_timeout     120s;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm-news.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        internal;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        return 404;
    }

    # Static assets
    location ~* \.(css|js|png|jpg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
