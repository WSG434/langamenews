[news_stream]
user  = www-data
group = www-data

listen = /run/php/php8.5-fpm-news_stream.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = static
pm.max_children      = 10

php_admin_value[error_log]         = /var/log/php/news-stream-fpm.log
php_admin_flag[log_errors]         = on
php_admin_value[memory_limit]      = 64M
php_admin_value[max_execution_time]= 0
php_admin_value[opcache.enable]    = 1
